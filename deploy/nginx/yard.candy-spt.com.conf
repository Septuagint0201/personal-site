server {
    listen 80;
    listen [::]:80;
    server_name yard.candy-spt.com;
    root /home/septuagintuser/site/candy-spt.com/yard;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        add_header Cache-Control no-store;
        try_files $uri =404;
    }
    location / { return 308 https://yard.candy-spt.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yard.candy-spt.com;
    root /home/septuagintuser/site/candy-spt.com/yard;
    index yard.html;
    include /etc/nginx/snippets/personal-site-static.conf;

    ssl_certificate /etc/letsencrypt/live/yard.candy-spt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yard.candy-spt.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        add_header Cache-Control no-store;
        try_files $uri =404;
    }
    location ~ /\.git(?:/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }
}
