# Include inside the Candy/YARD HTTPS server blocks only.
http2 on;
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
etag on;
add_header Cache-Control $personal_site_cache_control;
