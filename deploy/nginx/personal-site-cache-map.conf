# http context: /etc/nginx/conf.d/personal-site-cache-map.conf
# Only the Candy/YARD server snippet consumes this map.
map $uri $personal_site_cache_control {
    default "no-cache";
    "~^/(?:assets/)?[A-Za-z0-9_-]+-[A-Za-z0-9_-]{8,}\.(?:js|css|jpg|webp|avif)$" "public, max-age=31536000, immutable";
    ~*\.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ "public, max-age=3600, must-revalidate";
}
