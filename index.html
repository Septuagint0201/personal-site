<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Septuagint · Computing the universe with me."
    />
    <meta name="theme-color" content="#171d30" />
    <title>Septuagint</title>
    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch {}
        document.documentElement.dataset.theme =
          theme === "light" ||
          (theme !== "dark" &&
            matchMedia("(prefers-color-scheme: light)").matches)
            ? "light"
            : "dark";
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="site.css?v=1" />
    <script src="liquid-glass.js?v=5" defer></script>
    <script src="site.js?v=1" defer></script>
  </head>
  <body>
    <div class="site-scene" id="site-scene" aria-hidden="true">
      <canvas id="glass-canvas"></canvas>
    </div>
    <button
      type="button"
      class="theme-toggle glass-surface"
      id="themeToggle"
      data-radius="22"
      data-glass-compact
      title="切换主题"
      aria-label="切换主题"
    >
      <span aria-hidden="true">◐</span>
    </button>
    <main>
      <article
        class="card glass-surface"
        data-radius="36"
        aria-labelledby="name"
      >
        <div class="avatar-wrap">
          <span class="avatar-fallback" aria-hidden="true">S</span>
          <img
            src="avatar.jpg"
            class="avatar"
            width="96"
            height="96"
            alt="Septuagint 的头像"
          />
        </div>
        <h1 id="name">
          <span class="sr-only">Septuagint</span
          ><span id="typed-name" aria-hidden="true">Septuagint</span>
        </h1>
        <p class="tagline">Computing the universe with me. ...</p>
        <nav class="links" aria-label="社交与联系">
          <a
            class="glass-surface"
            data-radius="14"
            href="https://steamcommunity.com/id/septugaint"
            rel="noopener noreferrer"
            ><i class="fab fa-steam" aria-hidden="true"></i
            ><span>Steam</span></a
          >
          <a
            class="glass-surface"
            data-radius="14"
            href="https://github.com/Septuagint0201"
            rel="noopener noreferrer"
            ><i class="fab fa-github" aria-hidden="true"></i
            ><span>GitHub</span></a
          >
          <a
            class="glass-surface"
            data-radius="14"
            href="https://discord.gg/2TCxargaSe"
            rel="noopener noreferrer"
            ><i class="fab fa-discord" aria-hidden="true"></i
            ><span>Discord</span></a
          >
          <a
            class="glass-surface"
            data-radius="14"
            href="https://x.com/septuagint0504"
            rel="noopener noreferrer"
            ><i class="fab fa-x-twitter" aria-hidden="true"></i
            ><span>X</span></a
          >
          <a
            class="glass-surface"
            data-radius="14"
            href="mailto:septuagintks@gmail.com"
            ><i class="fas fa-envelope" aria-hidden="true"></i
            ><span>Email</span></a
          >
          <a
            class="glass-surface"
            data-radius="14"
            href="https://www.pixiv.net/users/81025946"
            rel="noopener noreferrer"
            ><i class="fas fa-palette" aria-hidden="true"></i
            ><span>Pixiv</span></a
          >
        </nav>
      </article>
    </main>
  </body>
</html>
